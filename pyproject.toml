[project]
name = "aihub"
version = "3.6.0"
description = "AIHub — единое управление агентами DSH и OpenCode из Telegram"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.12",
  "websockets>=13.0",
  "aiofiles>=24.1.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "watchfiles>=0.24.0",
  "cryptography>=43.0.0",
]

[project.scripts]
aihub-gatekeeper = "scripts.run_gatekeeper:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
